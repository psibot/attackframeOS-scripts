<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lanrecce · sign in</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body class="login">
<form class="card login-card" method="post" action="/login">
  <div class="brand"><span class="mark">◎</span><div><b>lanrecce</b><small>web console</small></div></div>
  <label>Access token<input type="password" name="token" autocomplete="current-password" autofocus required></label>
  <button class="btn primary block" type="submit">Sign in</button>
  <p class="muted small">The token is the <code>LANRECCE_TOKEN</code> the server was started with.</p>
</form>
</body>
</html>
